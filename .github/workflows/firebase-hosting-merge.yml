name: Deploy to Firebase Hosting on merge
on:
    push:
        branches:
            - main
jobs:
    build_and_deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            # Sets up Node, pnpm and runs vp install.
            - uses: voidzero-dev/setup-vp@v1.21.2
              with:
                  node-version: "24"
                  cache: true
            # Unit tests import functions/ source, and the deploy CLI analyses it, so its deps must be installed.
            - run: npm ci --prefix functions
            # Format, lint and type-aware lint checks.
            - run: vp check
            - run: vp test
            # Covers tests, scripts and functions/, which next build doesn't type-check.
            - run: vp run typecheck
            - run: vp exec next build
              env:
                  NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
                  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
                  NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
                  NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
                  NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
                  NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
            - name: Deploy hosting, functions, rules and indexes
              run: |
                  echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
                  GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" vp exec firebase deploy --project pumato-84497 --non-interactive --force
              env:
                  FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PUMATO_84497 }}
